[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"
[project]
name = "fly-drone"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "mujoco>=3.2,<4", "gymnasium>=0.29,<2", "fastapi>=0.115", "uvicorn[standard]>=0.30", "pillow>=10", "psutil>=5"]
[project.optional-dependencies]
train = ["stable-baselines3>=2.4,<3"]
dev = ["pytest>=8", "httpx>=0.27"]
[project.scripts]
fly-drone = "fly_drone.cli:main"
[tool.maturin]
manifest-path = "crates/brain-python/Cargo.toml"
python-source = "python"
module-name = "fly_drone._brain"
[tool.pytest.ini_options]
testpaths = ["tests"]
